<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Atlas — your AI, in every form{% endblock %}</title>
  <meta name="description" content="Atlas — voice chat, document chat, AI flashcards, and interview practice." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/atlas.css" />
  <link rel="stylesheet" href="/static/css/atlas-themes.css" />
  <link rel="stylesheet" href="/static/css/atlas-colorful.css" />
  <script>(function(){var t=localStorage.getItem("atlas.theme")||"dark";document.documentElement.dataset.theme=t;})();</script>
  {% block head %}{% endblock %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='8' fill='%23a78bfa'/%3E%3C/svg%3E" />
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  <script src="/static/js/theme.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
