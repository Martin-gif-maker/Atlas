{% extends "base.html" %}
{% block title %}Sign in · Atlas{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <a href="/" class="logo">
      <svg viewBox="0 0 24 24" width="22" height="22"><defs><linearGradient id="al" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient></defs><circle cx="12" cy="12" r="9" fill="url(#al)"/></svg>
      <span>Atlas</span>
    </a>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue.</p>
    {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}
    <form method="post" action="/login" autocomplete="on">
      <label>Username
        <input type="text" name="username" required minlength="3" autofocus />
      </label>
      <label>Password
        <input type="password" name="password" required minlength="6" />
      </label>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    <p class="auth-foot">
      No account yet? <a href="/register">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
